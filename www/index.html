
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Dialer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9eef2;
      font-family: Arial, sans-serif;
    }

    .dialer {
      width: 320px;
      padding: 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px #0002;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-bottom: 25px;
    }

    #number {
      width: 100%;
      height: 55px;
      border: none;
      border-bottom: 2px solid #ddd;
      font-size: 26px;
      text-align: center;
      outline: none;
      margin-bottom: 20px;
      background: transparent;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 22px;
      transition: 0.15s;
    }

    .key {
      height: 58px;
      border-radius: 50%;
      background: #f0f3f5;
      color: #222;
    }

    .key:hover {
      background: #dce4e9;
    }

    .call {
      width: 65px;
      height: 65px;
      margin-top: 22px;
      border-radius: 50%;
      background: #20bd64;
      color: white;
      font-size: 28px;
    }

    .delete {
      background: #ffe9e9;
      color: #d33;
    }

    #status {
      min-height: 20px;
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="dialer">
    <h2>Phone Dialer</h2>

    <input
      type="tel"
      id="number"
      placeholder="Enter number"
      autocomplete="off"
    >

    <div class="keypad">
      <button class="key" onclick="press('1')">1</button>
      <button class="key" onclick="press('2')">2</button>
      <button class="key" onclick="press('3')">3</button>

      <button class="key" onclick="press('4')">4</button>
      <button class="key" onclick="press('5')">5</button>
      <button class="key" onclick="press('6')">6</button>

      <button class="key" onclick="press('7')">7</button>
      <button class="key" onclick="press('8')">8</button>
      <button class="key" onclick="press('9')">9</button>

      <button class="key" onclick="press('*')">*</button>
      <button class="key" onclick="press('0')">0</button>
      <button class="key" onclick="press('#')">#</button>

      <button class="key delete" onclick="erase()">⌫</button>
      <button class="key" onclick="clearNumber()">C</button>
      <button class="key" onclick="press('+')">+</button>
    </div>

    <button class="call" onclick="callNumber()" title="Call">
      📞
    </button>

    <div id="status"></div>
  </div>

  <script>
    const numberInput = document.getElementById("number");
    const status = document.getElementById("status");

    function press(digit) {
      numberInput.value += digit;
      status.textContent = "";
    }

    function erase() {
      numberInput.value = numberInput.value.slice(0, -1);
    }

    function clearNumber() {
      numberInput.value = "";
      status.textContent = "";
    }

    function callNumber() {
      const number = numberInput.value.trim();

      if (!number) {
        status.textContent = "Please enter a phone number.";
        return;
      }

      // Opens the phone app on supported devices.
      window.location.href = "tel:" + number;
    }
  </script>
</body>
</html>
